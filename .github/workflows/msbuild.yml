name: Windows Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

env:
  SOLUTION_FILE_PATH: .\Sources\MacVietKey\win32\OpenKey
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Windows x86
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build Windows x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Package Windows ZIP Archives
      shell: bash
      run: |
        mkdir -p release_win
        cd Sources/MacVietKey/win32/OpenKey/x64/Release && 7z a -tzip ../../../../../release_win/MacVietKey-v2.2.0-windows-x64.zip * && cd -
        cd Sources/MacVietKey/win32/OpenKey/Release && 7z a -tzip ../../../../release_win/MacVietKey-v2.2.0-windows-x86.zip * && cd -

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacVietKey-Windows
        path: release_win/

    - name: Upload Windows Assets to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release_win/MacVietKey-v2.2.0-windows-x64.zip
          release_win/MacVietKey-v2.2.0-windows-x86.zip
