name: Publish Official Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code & Release Asset
        uses: actions/checkout@v4

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MacVietKey ${{ github.ref_name }}"
          body: |
            ### 🚀 MacVietKey ${{ github.ref_name }} — Bộ Gõ Tiếng Việt Chuẩn Mực Cho macOS
            
            Phát triển và bảo trợ bởi **360 CORP** & **VUA HỆ THỐNG** ([vuaoffice.com](https://vuaoffice.com)).
            
            #### 🌟 Điểm nổi bật:
            - **Watchdog tự phục hồi EventTap**: Khắc phục triệt để lỗi liệt bàn phím trên macOS Sequoia & Sonoma.
            - **Tối ưu Zero-IPC**: Loại bỏ độ trễ phím gõ trên Spotlight, Chrome và Safari.
            - **Phím tắt nhạy**: Mặc định tổ hợp `Control + Space` chuyển ngôn ngữ tức thì.
            - **Đầy đủ bộ mã**: Unicode dựng sẵn, TCVN3 (ABC), VNI Windows, Unicode tổ hợp.
            - **Kiến trúc Universal Binary**: Tương thích bản địa (Native) cả Apple Silicon (`arm64`) và Intel (`x86_64`).
            - **Bộ Identifier chuẩn VuaOffice**: `com.vuahethong.vuaoffice.macvietkey`.
            
            #### 📦 Hướng dẫn cài đặt:
            1. Tải tệp `MacVietKey-v2.2.1-macOS.dmg` đính kèm bên dưới.
            2. Mở đĩa ảo và kéo `MacVietKey.app` vào thư mục `/Applications`.
            3. Cấp quyền tại **System Settings &rarr; Privacy & Security &rarr; Accessibility**.
          draft: false
          prerelease: false
          files: |
            release/*
