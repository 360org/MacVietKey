name: Publish Official Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  publish_release:
    name: Initialize Official GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Official GitHub Release Entry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MacVietKey ${{ github.ref_name }}"
          body: |
            ### 🚀 MacVietKey ${{ github.ref_name }} — Bộ Gõ Tiếng Việt Chuẩn Mực Cho macOS

            Phát triển và bảo trợ bởi **360 CORP** & **VUA HỆ THỐNG** ([vuaoffice.com](https://vuaoffice.com)).

            #### 🌟 Điểm nổi bật:
            - **Tương thích bản địa Apple Silicon (arm64)**: Hỗ trợ 100% chip Apple Silicon M1, M2, M3, M4 với hiệu năng tối đa, không cần Rosetta 2.
            - **Bản Universal Binary**: Chạy mượt mà trên cả máy Apple Silicon (`arm64`) và Mac Intel (`x86_64`).
            - **Watchdog tự phục hồi EventTap**: Khắc phục triệt để lỗi liệt bàn phím trên macOS Sequoia & Sonoma.
            - **Tối ưu Zero-IPC**: Loại bỏ độ trễ phím gõ trên Spotlight, Chrome và Safari.
            - **Cơ chế Tự Động Cập Nhật (Auto Update)**: Tải và mở tệp cài đặt trực tiếp không gián đoạn.
            - **Phím tắt nhạy**: Mặc định tổ hợp `Control + Space` chuyển ngôn ngữ tức thì.
            - **Đầy đủ bộ mã**: Unicode dựng sẵn, TCVN3 (ABC), VNI Windows, Unicode tổ hợp.
            - **Bộ Identifier chuẩn VuaOffice**: `com.vuahethong.vuaoffice.macvietkey`.

            #### 📦 Tùy chọn cài đặt cho macOS:
            - **Apple Silicon (M1/M2/M3/M4)**: Tải tệp `MacVietKey-${{ github.ref_name }}-macOS-arm64.dmg` (Bản tối ưu Native).
            - **Universal (Mọi dòng Mac)**: Tải tệp `MacVietKey-${{ github.ref_name }}-macOS.dmg` hoặc `MacVietKey-${{ github.ref_name }}-macOS.zip`.
            - **Homebrew Cask**: `brew install --cask https://raw.githubusercontent.com/360org/MacVietKey/master/Casks/macvietkey.rb`

            *(Các gói cài đặt macOS, Windows và Linux được tự động biên dịch và gắn đính kèm vào bản phát hành này từ runner tương ứng).*
          draft: false
          prerelease: false
          files: |
            release/*
