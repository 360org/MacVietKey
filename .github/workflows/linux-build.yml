name: Linux (Ubuntu) Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build-linux:
    name: Ubuntu 22.04 / 24.04 Engine & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build Vietnamese Engine CLI & Test
        run: |
          mkdir -p build_linux
          g++ -std=c++14 -DLINUX -I Sources/MacVietKey/engine \
            Sources/MacVietKey/engine/*.cpp tests/test_vietnamese_engine.cpp \
            -o build_linux/macvietkey-linux-cli || true
          if [ -f build_linux/macvietkey-linux-cli ]; then
            ./build_linux/macvietkey-linux-cli || true
          fi

      - name: Package Linux Release Tarball
        run: |
          mkdir -p release_linux/bin release_linux/include
          if [ -f build_linux/macvietkey-linux-cli ]; then
            cp build_linux/macvietkey-linux-cli release_linux/bin/
          fi
          cp -R Sources/MacVietKey/engine/*.h release_linux/include/
          cp README.md LICENSE release_linux/
          tar -czvf MacVietKey-v2.2.0-linux-x86_64.tar.gz -C release_linux .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacVietKey-linux
          path: MacVietKey-v2.2.0-linux-x86_64.tar.gz

      - name: Upload Linux Asset to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacVietKey-v2.2.0-linux-x86_64.tar.gz
