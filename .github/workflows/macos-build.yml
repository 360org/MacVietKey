name: macOS Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS Universal (Apple Silicon & Intel)
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Release Version Environment
      id: vars
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
        else
          echo "VERSION=v2.2.4" >> $GITHUB_ENV
        fi

    - name: Build & Run Vietnamese Engine Test Suite
      run: |
        clang++ -std=c++14 -arch arm64 -arch x86_64 \
          tests/test_vietnamese_engine.cpp \
          Sources/MacVietKey/engine/Engine.cpp \
          Sources/MacVietKey/engine/Vietnamese.cpp \
          Sources/MacVietKey/engine/Macro.cpp \
          Sources/MacVietKey/engine/SmartSwitchKey.cpp \
          Sources/MacVietKey/engine/ConvertTool.cpp \
          -I Sources/MacVietKey/engine \
          -o tests/test_runner
        ./tests/test_runner
        file tests/test_runner
        lipo -info tests/test_runner

    - name: Build MacVietKey App Bundle (Universal 2 Binary)
      run: |
        mkdir -p build_derived/Build/Products/Release
        if xcodebuild -project Sources/MacVietKey/macOS/MacVietKey.xcodeproj \
          -scheme MacVietKey \
          -configuration Release \
          -derivedDataPath build_derived \
          -destination 'generic/platform=macOS' \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          MACOSX_DEPLOYMENT_TARGET=11.0 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          build; then
          FOUND_APP=$(find build_derived/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          if [ -n "$FOUND_APP" ] && [ "$FOUND_APP" != "build_derived/Build/Products/Release/MacVietKey.app" ]; then
            cp -R "$FOUND_APP" "build_derived/Build/Products/Release/MacVietKey.app"
          fi
        else
          echo "xcodebuild fallback: compiling Universal 2 Binary directly with clang/ibtool..."
          APP_BUNDLE="build_derived/Build/Products/Release/MacVietKey.app"
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          INC="-I Sources/MacVietKey/macOS/ModernKey -I Sources/MacVietKey/engine"
          mkdir -p /tmp/mvk_objs
          for f in Sources/MacVietKey/macOS/ModernKey/*.m; do
            clang -arch arm64 -arch x86_64 -fobjc-arc -mmacosx-version-min=11.0 -Wno-deprecated-declarations $INC -c "$f" -o "/tmp/mvk_objs/$(basename "$f").o"
          done
          for f in Sources/MacVietKey/macOS/ModernKey/*.mm; do
            clang++ -std=c++14 -arch arm64 -arch x86_64 -fobjc-arc -mmacosx-version-min=11.0 -Wno-deprecated-declarations $INC -c "$f" -o "/tmp/mvk_objs/$(basename "$f").o"
          done
          for f in Sources/MacVietKey/engine/*.cpp; do
            clang++ -std=c++14 -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -I Sources/MacVietKey/engine -c "$f" -o "/tmp/mvk_objs/$(basename "$f").o"
          done
          clang++ -std=c++14 -arch arm64 -arch x86_64 -mmacosx-version-min=11.0 /tmp/mvk_objs/*.o \
            -framework Cocoa -framework Carbon -framework AppKit -framework Foundation \
            -framework CoreGraphics -framework ApplicationServices -framework ServiceManagement \
            -o "$APP_BUNDLE/Contents/MacOS/MacVietKey"
          cp -R Sources/MacVietKey/macOS/ModernKey/Resources/* "$APP_BUNDLE/Contents/Resources/"
          ibtool --compilation-directory "$APP_BUNDLE/Contents/Resources" Sources/MacVietKey/macOS/ModernKey/Base.lproj/Main.storyboard
          VER_NUM="${VERSION#v}"
          sed -e 's/\$(EXECUTABLE_NAME)/MacVietKey/g' \
              -e 's/\$(PRODUCT_NAME)/MacVietKey/g' \
              -e 's/\$(PRODUCT_BUNDLE_IDENTIFIER)/com.vuahethong.vuaoffice.macvietkey/g' \
              -e "s/\$(MARKETING_VERSION)/${VER_NUM}/g" \
              -e 's/\$(CURRENT_PROJECT_VERSION)/54/g' \
              -e 's/\$(MACOSX_DEPLOYMENT_TARGET)/11.0/g' \
              -e 's/\$(DEVELOPMENT_LANGUAGE)/vi/g' \
              Sources/MacVietKey/macOS/ModernKey/Info.plist > "$APP_BUNDLE/Contents/Info.plist"
          printf "APPL????" > "$APP_BUNDLE/Contents/PkgInfo"
        fi

        # Build & embed MacVietKeyHelper.app into Contents/Library/LoginItems
        APP_BUNDLE="build_derived/Build/Products/Release/MacVietKey.app"
        HELPER_BUNDLE="$APP_BUNDLE/Contents/Library/LoginItems/MacVietKeyHelper.app"
        mkdir -p "$HELPER_BUNDLE/Contents/MacOS"
        clang -arch arm64 -arch x86_64 -fobjc-arc -mmacosx-version-min=11.0 -Wno-deprecated-declarations \
          Sources/MacVietKey/macOS/MacVietKeyHelper/main.m \
          Sources/MacVietKey/macOS/MacVietKeyHelper/AppDelegate.m \
          -framework Cocoa -framework Foundation -framework AppKit \
          -o "$HELPER_BUNDLE/Contents/MacOS/MacVietKeyHelper"
        cp Sources/MacVietKey/macOS/MacVietKeyHelper/Info.plist "$HELPER_BUNDLE/Contents/Info.plist"
        codesign --force --deep --sign - -i com.vuahethong.vuaoffice.macvietkey.helper -r='designated => identifier "com.vuahethong.vuaoffice.macvietkey.helper"' "$HELPER_BUNDLE"

    - name: Sign & Verify Mach-O Architecture
      run: |
        APP_PATH="build_derived/Build/Products/Release/MacVietKey.app"
        BINARY_PATH="${APP_PATH}/Contents/MacOS/$(defaults read "${APP_PATH}/Contents/Info.plist" CFBundleExecutable 2>/dev/null || echo "MacVietKey")"

        echo "=== Verifying Architectures ==="
        file "${BINARY_PATH}"
        lipo -info "${BINARY_PATH}"

        echo "=== Ad-hoc Codesigning ==="
        codesign --force --deep --sign - -i com.vuahethong.vuaoffice.macvietkey -r='designated => identifier "com.vuahethong.vuaoffice.macvietkey"' "${APP_PATH}"
        codesign -dvvv "${APP_PATH}"

    - name: Package DMG and ZIP Release Artifacts
      run: |
        mkdir -p build_dist
        APP_PATH="build_derived/Build/Products/Release/MacVietKey.app"

        echo "=== 1. Package Universal DMG ==="
        mkdir -p dmg_universal
        cp -R "${APP_PATH}" dmg_universal/
        ln -s /Applications dmg_universal/Applications
        touch dmg_universal/.metadata_never_index
        for attempt in 1 2 3 4 5; do
          hdiutil create -volname "MacVietKey" \
            -srcfolder dmg_universal \
            -ov -format UDZO \
            "build_dist/MacVietKey-${{ env.VERSION }}-macOS.dmg" && break
          echo "hdiutil retry $attempt..."
          sleep 3
        done

        echo "=== 2. Package Apple Silicon (arm64 Native) DMG ==="
        mkdir -p dmg_arm64
        cp -R "${APP_PATH}" dmg_arm64/
        BINARY_FILE="dmg_arm64/MacVietKey.app/Contents/MacOS/$(defaults read "${APP_PATH}/Contents/Info.plist" CFBundleExecutable 2>/dev/null || echo "MacVietKey")"
        if lipo -info "${BINARY_FILE}" | grep -q "arm64"; then
          lipo -extract arm64 "${BINARY_FILE}" -output "${BINARY_FILE}.arm64" && mv "${BINARY_FILE}.arm64" "${BINARY_FILE}"
        fi
        codesign --force --deep --sign - -i com.vuahethong.vuaoffice.macvietkey -r='designated => identifier "com.vuahethong.vuaoffice.macvietkey"' "dmg_arm64/MacVietKey.app"
        ln -s /Applications dmg_arm64/Applications
        touch dmg_arm64/.metadata_never_index
        for attempt in 1 2 3 4 5; do
          hdiutil create -volname "MacVietKey (Apple Silicon)" \
            -srcfolder dmg_arm64 \
            -ov -format UDZO \
            "build_dist/MacVietKey-${{ env.VERSION }}-macOS-arm64.dmg" && break
          echo "hdiutil arm64 retry $attempt..."
          sleep 3
        done

        echo "=== 3. Package Universal ZIP ==="
        (cd build_derived/Build/Products/Release && zip -r -y -q "${GITHUB_WORKSPACE}/build_dist/MacVietKey-${{ env.VERSION }}-macOS.zip" MacVietKey.app)

        ls -lh build_dist/
        shasum -a 256 build_dist/*

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacVietKey-macOS-Build
        path: build_dist/*

    - name: Upload macOS Assets to Official GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: |
          build_dist/MacVietKey-${{ env.VERSION }}-macOS.dmg
          build_dist/MacVietKey-${{ env.VERSION }}-macOS-arm64.dmg
          build_dist/MacVietKey-${{ env.VERSION }}-macOS.zip
