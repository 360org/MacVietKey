name: macOS Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

    - name: Build MacVietKey Test Suite
      run: |
        clang++ -std=c++14 \
          tests/test_vietnamese_engine.cpp \
          Sources/OpenKey/engine/Engine.cpp \
          Sources/OpenKey/engine/Vietnamese.cpp \
          Sources/OpenKey/engine/Macro.cpp \
          Sources/OpenKey/engine/SmartSwitchKey.cpp \
          Sources/OpenKey/engine/ConvertTool.cpp \
          -I Sources/OpenKey/engine \
          -o tests/test_runner
        ./tests/test_runner

    - name: Build MacVietKey Xcode Project
      run: |
        xcodebuild -project Sources/OpenKey/macOS/OpenKey.xcodeproj \
          -scheme OpenKey \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Prepare Application Bundle
      run: |
        mkdir -p build_output
        BUILT_APP=$(find ~/Library/Developer/Xcode/DerivedData -name "OpenKey.app" -type d | head -n 1)
        if [ -n "$BUILT_APP" ]; then
          cp -R "$BUILT_APP" build_output/MacVietKey.app
          cd build_output && zip -r MacVietKey-macOS.zip MacVietKey.app
        else
          echo "Warning: Built app not found in standard DerivedData"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacVietKey-macOS
        path: build_output/

    - name: Create GitHub Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "MacVietKey Release ${{ github.ref_name }}"
        body: |
          ### MacVietKey — Bản Phát Hành Chính Thức ${{ github.ref_name }}
          Bộ gõ tiếng Việt mã nguồn mở tối ưu cho macOS kế thừa từ OpenKey & EVKey.

          #### Điểm nổi bật:
          - **Tự động phục hồi EventTap (Watchdog)**: Chống đơ/liệt bàn phím trên macOS Sequoia và Sonoma.
          - **Tối ưu Zero-IPC**: Loại bỏ độ trễ phím gõ trên Spotlight và các trình duyệt Chromium/Safari.
          - **Phím tắt chuyển ngôn ngữ nhạy**: Khớp chính xác cờ phím tức thời, không bị trôi cờ.
          - **Hỗ trợ trọn gói bộ mã**: Unicode dựng sẵn, Unicode tổ hợp, TCVN3 (ABC), VNI Windows.
          - **Chuẩn Identifier VuaOffice**: `com.vuahethong.macvietkey`.
        files: |
          build_output/MacVietKey-macOS.zip
