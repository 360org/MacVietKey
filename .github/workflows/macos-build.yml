name: macOS Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build MacVietKey Test Suite (Universal arm64 & x86_64)
      run: |
        clang++ -std=c++14 -arch arm64 -arch x86_64 \
          tests/test_vietnamese_engine.cpp \
          Sources/MacVietKey/engine/Engine.cpp \
          Sources/MacVietKey/engine/Vietnamese.cpp \
          Sources/MacVietKey/engine/Macro.cpp \
          Sources/MacVietKey/engine/SmartSwitchKey.cpp \
          Sources/MacVietKey/engine/ConvertTool.cpp \
          -I Sources/MacVietKey/engine \
          -o tests/test_runner
        ./tests/test_runner
        file tests/test_runner

    - name: Build MacVietKey Xcode Project
      run: |
        xcodebuild -project Sources/MacVietKey/macOS/MacVietKey.xcodeproj \
          -scheme MacVietKey \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MacVietKey-macOS
        path: release/MacVietKey-v2.2.0-macOS.zip
